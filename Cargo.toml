[workspace]
resolver = "2"
members = ["crates/prismal-ir", "crates/prismal-kernel", "crates/prismal-runtime", "crates/prismal-syntax", "crates/prismal-present", "crates/prismal-host", "crates/prismal-web", "crates/prismal-svg", "crates/prismal-stdio", "crates/prismal-media"]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lints every crate follows (`[lints] workspace = true`); CI denies the rest of clippy's
# default warnings. Allowed: dimension arithmetic names its methods `add` and `mul`; the
# syntax tree's enums keep their variants unboxed; the runtime's event iteration takes its
# state as arguments; negated comparisons are kept where a NaN must fail the test.
[workspace.lints.clippy]
should_implement_trait = "allow"
large_enum_variant = "allow"
too_many_arguments = "allow"
neg_cmp_op_on_partial_ord = "allow"
needless_range_loop = "allow"

[profile.test]
opt-level = 2
